name: Release On Version Bump

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: emerald-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Validate release version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { readFileSync } = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const theme = JSON.parse(readFileSync('komari-theme.json', 'utf8'))
          if (pkg.version !== theme.version || !/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error('Package and theme require the same stable SemVer version')
          }
          let changed = true
          const before = process.env.BEFORE_SHA
          if (before && !/^0+$/.test(before)) {
            const previous = JSON.parse(execFileSync('git', ['show', `${before}:package.json`], { encoding: 'utf8' }))
            changed = previous.version !== pkg.version
          }
          console.log(`version=${pkg.version}`)
          console.log(`changed=${changed}`)
          NODE
      - run: bun install --frozen-lockfile
      - name: Lint without accepting uncommitted fixes
        run: |
          bun run lint
          git diff --exit-code
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: emerald-release
          path: komari-theme-emerald-build-*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'wugan666/komari-theme-emerald' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: emerald-release
          path: release
      - name: Publish immutable release after the asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published assets."
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; use a new version."
            exit 1
          fi
          assets=(release/komari-theme-emerald-build-*.zip)
          [ "${#assets[@]}" -eq 1 ] && [ -f "${assets[0]}" ]
          gh release create "$tag" "${assets[0]}" --repo "$REPO" --target "$COMMIT" --title "$tag" --generate-notes --draft
          gh release edit "$tag" --repo "$REPO" --draft=false --latest
